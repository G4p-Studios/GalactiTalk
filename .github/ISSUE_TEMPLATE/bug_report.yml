name: Bug report
description: Report reproducible incorrect behavior in GalactiTalk.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, YouTube cookies, private messages, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, Python version, TeamTalk server/client version, and audio server.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start GalactiTalk with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove credentials, tokens, cookies, server addresses, usernames, and private content.
      render: text
